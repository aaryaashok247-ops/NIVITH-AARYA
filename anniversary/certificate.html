<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Best Boyfriend Certificate ❤️</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #7b0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    /* Certificate box */
    .certificate {
      max-width: 750px;
      width: 90%;
      padding: 45px;
      background: #fff8e7;
      border: 8px double #caa34d;
      border-radius: 25px;
      text-align: center;
      color: #5b0a0a;
      box-shadow: 0 0 40px rgba(202, 163, 77, 0.6);
      animation: fadeIn 2s ease;
    }

    .certificate h1 {
      font-size: 2.4em;
      margin-bottom: 20px;
      color: #8b0000;
    }

    .cert-subtitle {
      font-size: 1.2em;
      margin-bottom: 20px;
    }

    .cert-name {
      font-size: 3em;
      margin: 25px 0;
      color: #7b0f1a;
      font-family: "Brush Script MT", cursive;
    }

    .cert-text {
      font-size: 1.15em;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    /* Nav buttons */
    .nav-buttons {
      position: absolute;
      bottom: 25px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 40px;
    }

    .nav-buttons a {
      background: rgba(255,255,255,0.15);
      border: 2px solid #ffd6d6;
      color: white;
      padding: 10px 22px;
      border-radius: 30px;
      text-decoration: none;
      backdrop-filter: blur(4px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="certificate">
    <h1>Certificate of Love ❤️</h1>

    <p class="cert-subtitle">
      This certificate is proudly presented to
    </p>

    <div class="cert-name">
      Nivith
    </div>

    <p class="cert-text">
      For being the best boyfriend ever —<br>
      for the love, patience, laughter, and forever promises.<br><br>
      Awarded with all my heart 💖
    </p>
  </div>

  <div class="nav-buttons">
    <a href="letter.html">⬅ Back</a>
    <a href="gallery.html">Next ➜</a>
  </div>

</body>
</html>
